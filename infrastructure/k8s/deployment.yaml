apiVersion: v1
kind: Namespace
metadata:
  name: budget-tracker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: budget-tracker-postgres-data
  namespace: budget-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-tracker-postgres
  namespace: budget-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-tracker-postgres
  template:
    metadata:
      labels:
        app: budget-tracker-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: budget-tracker-app-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: budget-tracker-app-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: budget-tracker-app-secrets
                  key: postgres-db
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: budget-tracker-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: budget-tracker-postgres
  namespace: budget-tracker
spec:
  type: ClusterIP
  selector:
    app: budget-tracker-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-tracker-backend
  namespace: budget-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-tracker-backend
  template:
    metadata:
      labels:
        app: budget-tracker-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z budget-tracker-postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: api
          image: docker.io/travler7282/budget-tracker-backend:0.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_HOST
              value: 0.0.0.0
            - name: APP_PORT
              value: "8000"
            - name: APP_BASE_PATH
              value: /budget-tracker
            - name: CORS_ALLOWED_ORIGINS
              value: https://www.travler7282.com,https://api.travler7282.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: budget-tracker-app-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: budget-tracker-app-secrets
                  key: jwt-secret-key
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: budget-tracker-app-secrets
                  key: bootstrap-admin-username
                  optional: true
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: budget-tracker-app-secrets
                  key: bootstrap-admin-password
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: budget-tracker-backend
  namespace: budget-tracker
spec:
  type: ClusterIP
  selector:
    app: budget-tracker-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: budget-tracker-strip-prefix
  namespace: budget-tracker
spec:
  stripPrefix:
    prefixes:
      - /budget-tracker
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: budget-tracker-backend
  namespace: budget-tracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: budget-tracker-budget-tracker-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.travler7282.com
      secretName: budget-tracker-tls
  rules:
    - host: api.travler7282.com
      http:
        paths:
          - path: /budget-tracker
            pathType: Prefix
            backend:
              service:
                name: budget-tracker-backend
                port:
                  name: http
