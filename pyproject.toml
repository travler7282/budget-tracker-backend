[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budget-tracker-backend"
version = "1.0.0"
description = "A FastAPI backend for budget tracking with SQLAlchemy, JWT authentication, and Kubernetes-friendly health endpoints"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Developer" },
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "python-jose[cryptography]",
    "passlib>=1.7.4",
    "python-multipart",
]

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src"]