[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budget-tracker-backend"
version = "2.0.0"
description = "A FastAPI backend for budget tracking with SQLAlchemy, JWT authentication, and Kubernetes-friendly health endpoints"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Developer" },
]
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "passlib>=1.7.4,<2.0",
    "pydantic>=2.7,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.6,<8.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
